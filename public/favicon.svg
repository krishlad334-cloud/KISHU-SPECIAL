<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="50%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#E6E6FA"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83E8C"/>
      <stop offset="50%" stop-color="#D63384"/>
      <stop offset="100%" stop-color="#7952B3"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#DA70D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#845EF7" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="140" fill="url(#bg)"/>
  <!-- Romantic Heart Background Ring -->
  <path d="M256 420 C140 330 80 250 80 170 C80 110 125 70 185 70 C222 70 246 90 256 108 C266 90 290 70 327 70 C387 70 432 110 432 170 C432 250 372 330 256 420 Z" fill="none" stroke="url(#heartGrad)" stroke-width="12" stroke-dasharray="12 8" opacity="0.4"/>
  <!-- Sparkles -->
  <path d="M256 40 C259 55 264 60 279 63 C264 66 259 71 256 86 C253 71 248 66 233 63 C248 60 253 55 256 40 Z" fill="#FF85A1" filter="url(#glow)"/>
  <path d="M410 340 C412 352 416 356 428 358 C416 360 412 364 410 376 C408 364 404 360 392 358 C404 356 408 352 410 340 Z" fill="#B5179E" opacity="0.8"/>
  <path d="M100 130 C102 140 106 144 116 145 C106 146 102 150 100 160 C98 150 94 146 84 145 C94 144 98 140 100 130 Z" fill="#FF69B4" opacity="0.8"/>
  <!-- K Monogram for Kishu -->
  <text x="50%" y="71%" text-anchor="middle" font-family="'Great Vibes', 'Playfair Display', cursive, serif" font-size="290" font-weight="bold" fill="url(#textGrad)" filter="url(#shadow)">K</text>
</svg>